<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Selector: Wants and Needs</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Quicksand:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --card: #ffffff;
            --accent: #f59e0b;
            --text: #1e293b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            padding: 2rem;
            color: var(--text);
            padding-bottom: 8rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: 'Quicksand', sans-serif;
            color: var(--primary);
            font-size: 2.5rem;
        }

        .word-section {
            background: var(--card);
            padding: 2rem;
            border-radius: 2.5rem;
            margin-bottom: 3rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .word-title {
            font-size: 2rem;
            text-transform: capitalize;
            margin-bottom: 1.5rem;
            color: var(--primary);
            border-bottom: 3px solid #f1f5f9;
            padding-bottom: 0.5rem;
            font-weight: 800;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .img-card {
            cursor: pointer;
            border: 4px solid transparent;
            border-radius: 1.5rem;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .img-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .img-card:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
        }

        .img-card.selected {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.2);
        }

        .selected-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #22c55e;
            color: white;
            padding: 0.5rem;
            border-radius: 50%;
            display: none;
            width: 35px;
            height: 35px;
            text-align: center;
            line-height: normal;
            font-size: 1.2rem;
            z-index: 5;
        }

        .img-card.selected .selected-badge {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .custom-url-container {
            margin-top: 2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: #f1f5f9;
            padding: 1.5rem;
            border-radius: 1.5rem;
        }

        .custom-url-label {
            font-weight: 700;
            color: var(--primary);
            font-size: 1.1rem;
        }

        .custom-url-input {
            width: 100%;
            padding: 1rem 1.5rem;
            border: 2px solid #cbd5e1;
            border-radius: 1rem;
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s;
        }

        .custom-url-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .footer {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--primary);
            padding: 1rem 2rem;
            border-radius: 100px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            display: flex;
            gap: 1rem;
            z-index: 1000;
        }

        button {
            background: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 50px;
            font-weight: 800;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>Pick the best images! 📸</h1>
        <p>Select a suggestion or paste your own direct image URL.</p>
    </div>

    <div id="sections-container"></div>

    <div class="footer">
        <button onclick="copyResults()">📋 Copy Results</button>
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})">⬆ Top</button>
    </div>

    <script>
        const data = [
            {
                word: "shoes",
                options: [
                    "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1514989940723-e8e51635b782?q=80&w=600&auto=format&fit=crop"
                ]
            },
            {
                word: "coat",
                options: [
                    "https://images.unsplash.com/photo-1591047139829-d91aec36caea?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1539533377285-30138d017a42?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1544923246-77307dd654ca?q=80&w=600&auto=format&fit=crop"
                ]
            },
            {
                word: "crayons",
                options: [
                    "https://images.unsplash.com/photo-1513364776144-60967b0f800f?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1562975079-661726a76059?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1568858204229-8739cf9e5762?q=80&w=600&auto=format&fit=crop"
                ]
            },
            {
                word: "soap",
                options: [
                    "https://images.unsplash.com/photo-1600857062241-98e5dba7f214?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1590439471364-192aa70c0b53?q=80&w=600&auto=format&fit=crop"
                ]
            },
            {
                word: "food",
                options: [
                    "https://images.unsplash.com/photo-1490645935967-10de6ba17061?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1493770348161-369560ae357d?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=600&auto=format&fit=crop"
                ]
            },
            {
                word: "water",
                options: [
                    "https://images.unsplash.com/photo-1548964856-ac52127e4922?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1523362628744-4c285810b66b?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1559839914-17aae19ceafl?q=80&w=600&auto=format&fit=crop"
                ]
            },
            {
                word: "hat",
                options: [
                    "https://images.unsplash.com/photo-1521369909029-2afed882baee?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1533055640609-24b498dfd74c?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1572307480813-ceb0e59d8325?q=80&w=600&auto=format&fit=crop"
                ]
            },
            {
                word: "milk",
                options: [
                    "https://images.unsplash.com/photo-1550583724-125581fe2fd8?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1563636619-e910-0965d487f978?q=80&w=600&auto=format&fit=crop",
                    "https://images.unsplash.com/photo-1528498033373-3c6c08e93d79?q=80&w=600&auto=format&fit=crop"
                ]
            }
        ];

        const selections = {};
        const container = document.getElementById('sections-container');

        data.forEach(item => {
            const section = document.createElement('div');
            section.className = 'word-section';

            section.innerHTML = `
                <div class="word-title">${item.word}</div>
                <div class="grid" id="grid-${item.word}"></div>
                <div class="custom-url-container">
                    <label class="custom-url-label">Or use your own image URL:</label>
                    <input type="text" 
                           class="custom-url-input" 
                           placeholder="Paste direct link here (e.g. https://site.com/photo.jpg)" 
                           oninput="handleCustomInput(this, '${item.word}')">
                </div>
            `;

            const grid = section.querySelector(`#grid-${item.word}`);
            item.options.forEach((url, i) => {
                const card = document.createElement('div');
                card.className = 'img-card';
                card.innerHTML = `
                    <img src="${url}" alt="${item.word} ${i}">
                    <div class="selected-badge">✓</div>
                `;
                card.onclick = () => {
                    section.querySelectorAll('.img-card').forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selections[item.word] = url;
                    // Clear custom input
                    section.querySelector('.custom-url-input').value = "";
                };
                grid.appendChild(card);
            });

            container.appendChild(section);
        });

        function handleCustomInput(input, word) {
            const val = input.value.trim();
            const section = input.closest('.word-section');
            if (val) {
                section.querySelectorAll('.img-card').forEach(c => c.classList.remove('selected'));
                selections[word] = val;
            }
        }

        function copyResults() {
            const results = data.map(item => ({
                word: item.word,
                image: selections[item.word] || item.options[0]
            }));

            const text = JSON.stringify(results, null, 2);
            navigator.clipboard.writeText(text).then(() => {
                alert("Choices copied to clipboard! Paste them back to me in the chat.");
            });
        }
    </script>
</body>

</html>
