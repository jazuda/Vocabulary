<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary Lab | Registro General</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #37352f;
            --text-muted: #787774;
            --border-color: #e9e9e8;
            --hover-bg: #f5f5f4;
            --accent: #2383e2;
            --max-width: 1100px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 4rem 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: var(--max-width);
        }

        header {
            margin-bottom: 3rem;
            position: relative;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--text-main);
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .sync-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: var(--accent);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .sync-btn:hover {
            background: #1a73e8;
            transform: translateY(-1px);
        }

        .sync-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Stats Panel */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            padding: 1.5rem;
            background: var(--hover-bg);
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
        }

        .stat-label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* Filters */
        .filters-section {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-input {
            flex: 1;
            min-width: 200px;
            padding: 0.6rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            outline: none;
            font-size: 0.9rem;
        }

        .filter-input:focus {
            border-color: var(--accent);
        }

        /* Table */
        .section-label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        .scores-table-container {
            width: 100%;
            overflow-x: auto;
            border-radius: 0.75rem;
            border: 1px solid var(--border-color);
        }

        .scores-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            background: white;
        }

        .scores-table th {
            text-align: left;
            padding: 1rem;
            color: var(--text-muted);
            font-weight: 600;
            background: var(--hover-bg);
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        .scores-table td {
            padding: 1rem;
            border-bottom: 1px solid #f9f9f9;
        }

        .score-val {
            font-weight: 700;
            color: var(--accent);
        }

        .class-badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 0.3rem;
            font-size: 0.75rem;
            font-weight: 600;
            background: #eef2ff;
            color: #4f46e5;
        }

        .empty-state {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-muted);
            background: var(--hover-bg);
            border-radius: 1rem;
            border: 1px dashed var(--border-color);
        }

        .clear-btn {
            margin-top: 2rem;
            background: #fff;
            border: 1px solid #ffcfcf;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            cursor: pointer;
            color: #eb5757;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #fff5f5;
            border-color: #eb5757;
        }

        @media (max-width: 600px) {
            .sync-btn {
                position: static;
                width: 100%;
                margin-bottom: 1rem;
                justify-content: center;
            }

            .scores-table th:nth-child(2),
            .scores-table td:nth-child(2) {
                display: none;
            }

            /* Ocultar clase en móvil */
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-link">← Volver al Portal</a>
            <h1>Libro de Calificaciones</h1>
            <p style="color: var(--text-muted);">Registro general de actividad en la nube.</p>
            <button id="syncBtn" class="sync-btn" onclick="syncFromCloud()">🔄 Sincronizar Nube</button>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Total Jugadas</div>
                <div class="stat-value" id="totalPlays">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Puntuación Media</div>
                <div class="stat-value" id="avgScore">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Estudiantes Únicos</div>
                <div class="stat-value" id="uniqueStudents">0</div>
            </div>
        </div>

        <div class="filters-section">
            <input type="text" id="searchName" class="filter-input" placeholder="Buscar por estudiante..."
                oninput="applyFilters()">
            <input type="text" id="searchApp" class="filter-input" placeholder="Filtrar por aplicación o clase..."
                oninput="applyFilters()">
        </div>

        <div class="section-label" id="tableLabel">Historial Detallado (Local)</div>

        <div id="scoresContent">
            <div class="scores-table-container">
                <table class="scores-table" id="scoresTable">
                    <thead>
                        <tr>
                            <th>Estudiante</th>
                            <th>Salón / Clase</th>
                            <th>Aplicación</th>
                            <th>Puntos</th>
                            <th>Tiempo</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="scoresBody"></tbody>
                </table>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <p>No se encontraron resultados.</p>
            </div>

            <button onclick="clearScores()" id="clearBtn" class="clear-btn" style="display: none;">Borrar Historial
                Local</button>
        </div>
    </div>

    <script>
        // CONFIGURACIÓN: URL de tu Google Sheet
        const WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbxeP7G4odynvqOqiSYwz-Xun-i8ZRjs2G_-xmvM7XpHS_5G3F-t8gb2TXlffyVuL1IbxQ/exec";

        let allScores = [];

        function loadScores() {
            // Cargar local primero
            allScores = JSON.parse(localStorage.getItem('vocabulary_lab_scores') || '[]');
            updateStats(allScores);
            applyFilters();

            // Sincronizar nube automático
            if (WEBHOOK_URL) syncFromCloud();
        }

        async function syncFromCloud() {
            if (!WEBHOOK_URL) return;

            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.innerText = "⏳ Sincronizando...";

            try {
                const response = await fetch(WEBHOOK_URL);
                const rawData = await response.json();

                if (Array.isArray(rawData)) {
                    // Normalizar datos para evitar el "undefined"
                    allScores = rawData.map(item => {
                        // Buscamos las propiedades sin importar si son mayúsculas o minúsculas
                        const find = (keys) => {
                            for (let k of keys) {
                                if (item[k] !== undefined) return item[k];
                                // Probar versión capitalizada
                                let cap = k.charAt(0).toUpperCase() + k.slice(1);
                                if (item[cap] !== undefined) return item[cap];
                            }
                            return "";
                        };

                        return {
                            name: find(['name', 'nombre', 'estudiante']),
                            class: find(['class', 'clase', 'salón', 'salon']),
                            app: find(['app', 'aplicación', 'tema']),
                            score: find(['score', 'puntos', 'puntuación']),
                            time: find(['time', 'tiempo']),
                            date: find(['date', 'fecha'])
                        };
                    });

                    document.getElementById('tableLabel').innerText = "Historial Detallado (Nube)";
                    updateStats(allScores);
                    applyFilters();
                }
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "🔄 Sincronizar Nube";
            }
        }

        function updateStats(scores) {
            document.getElementById('totalPlays').innerText = scores.length;
            if (scores.length > 0) {
                const validScores = scores.map(s => parseInt(s.score)).filter(n => !isNaN(n));
                const avg = validScores.length > 0 ? validScores.reduce((a, b) => a + b, 0) / validScores.length : 0;
                document.getElementById('avgScore').innerText = Math.round(avg);
                const uniqueNames = new Set(scores.map(s => s.name?.toLowerCase().trim()).filter(n => n));
                document.getElementById('uniqueStudents').innerText = uniqueNames.size;
            }
        }

        function applyFilters() {
            const nameQuery = document.getElementById('searchName').value.toLowerCase();
            const appQuery = document.getElementById('searchApp').value.toLowerCase();
            const body = document.getElementById('scoresBody');
            const table = document.getElementById('scoresTable');
            const emptyState = document.getElementById('emptyState');

            const filtered = allScores.filter(s =>
                (s.name || "").toLowerCase().includes(nameQuery) &&
                ((s.app || "").toLowerCase().includes(appQuery) || (s.class || "").toLowerCase().includes(appQuery))
            ).reverse();

            if (filtered.length > 0) {
                table.parentElement.style.display = 'block';
                emptyState.style.display = 'none';
                body.innerHTML = filtered.map(s => `
                    <tr>
                        <td style="font-weight: 600;">${s.name || '---'}</td>
                        <td><span class="class-badge">${s.class || 'Sin clase'}</span></td>
                        <td style="color: var(--text-muted); font-size: 0.85rem;">${s.app || '---'}</td>
                        <td class="score-val">${s.score !== "" ? s.score : '0'}</td>
                        <td>${s.time || '---'}</td>
                        <td style="color: #a1a19f; font-size: 0.8rem;">${s.date || '---'}</td>
                    </tr>
                `).join('');
            } else {
                table.parentElement.style.display = 'none';
                emptyState.style.display = 'block';
            }
        }

        function clearScores() {
            if (confirm('¿Borrar historial local?')) {
                localStorage.removeItem('vocabulary_lab_scores');
                loadScores();
            }
        }

        loadScores();
    </script>
</body>

</html>
