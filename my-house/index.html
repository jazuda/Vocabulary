<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocabulary: My House</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&family=Quicksand:wght@500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../core/styles.css">
    <script src="../core/engine.js" defer></script>
</head>

<body>
    <div class="progress-bar" id="progress"></div>
    <div class="score-display" id="scoreDisplay">Score: 100</div>
    <div class="timer-display" id="timerDisplay">Time: 00:00</div>

    <div class="slide-container" id="container">
        <!-- Contenido inyectado por engine.js -->
    </div>

    <!-- Navigation Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <button class="close-menu" onclick="toggleMenu()">✕</button>
        <div class="menu-content">
            <div class="menu-title">Menu</div>
            <div class="menu-item" onclick="goToSlide(0)">Vocabulary</div>
            <div class="menu-item" onclick="goToSlide(6)">Guess the word</div>
            <div class="menu-item" onclick="goToSlide(12)">Fill in the blanks</div>
            <div class="menu-divider"></div>
            <div class="menu-item home-link" onclick="window.location.href='../'">🏠 Volver al Inicio</div>
        </div>
    </div>

    <!-- Controls -->
    <div class="controls">
        <div class="nav-buttons">
            <button class="nav-btn" onclick="toggleMenu()">☰</button>
            <button class="nav-btn" onclick="prevSlide()">←</button>
            <button class="nav-btn" onclick="nextSlide()">→</button>
        </div>
        <div class="topic-label">My House</div>
    </div>

    <script>
        const config = {
            title: "My House 🏠",
            vocab: [
                {
                    word: "table",
                    sentence: "A table is a piece of furniture with a flat top and legs where we eat or work.",
                    image: "https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc?q=80&w=600&auto=format&fit=crop"
                },
                {
                    word: "chair",
                    sentence: "A chair is something you sit on that usually has a back and four legs.",
                    image: "https://images.unsplash.com/photo-1592078615290-033ee584e267?q=80&w=600&auto=format&fit=crop"
                },
                {
                    word: "kitchen",
                    sentence: "A kitchen is the room in a house where people cook and prepare food.",
                    image: "https://images.unsplash.com/photo-1588854337236-6889d631faa8?q=80&w=600&auto=format&fit=crop"
                },
                {
                    word: "microwave",
                    sentence: "A microwave is a fast oven that uses waves to heat up food quickly.",
                    image: "https://images.unsplash.com/photo-1574269909862-7e1d70bb8078?q=80&w=600&auto=format&fit=crop"
                },
                {
                    word: "window",
                    sentence: "A window is an opening in a wall with glass that lets light and air into the room.",
                    image: "https://jooinn.com/images/window-32.jpg"
                }
            ]
        };

        const init = () => {
            if (typeof initPresentation === 'function') {
                initPresentation(config);
            } else {
                setTimeout(init, 50);
            }
        };
        init();
    </script>
</body>

</html>
